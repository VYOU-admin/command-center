# PONS — the worked example for the intake runner, and now the config its
# REBUILD runs from.
#
# PONS was originally loaded by scratchpad scripts that were lost, under rules
# that have since changed three ways: it excluded 2,001 EIP-7702 delegated
# accounts the current rule keeps, it used the 3 configured router addresses
# where behaviour finds 62 candidates, and it has no transfer rows. The rebuild
# was approved on 2026-09-10.
#
# PONS-P1-T (396 hop wallets) is a SEPARATE tag and is not touched by it.
#
# Every figure here was measured during the original intake. Nothing is recalled.

chain: robinhood
ticker: PONS
# Checksummed exactly as the chain returns it, and as tokens.mint and
# wallet_tags.mint store it. Lowercasing it here would match no cohort.
token: "0x39dBED3a2bd333467115dE45665cC57F813C4571"
charted_pair: "0x10cc6bd38112cac182db90b6a71d8bb5939526ba"

# MULTIPLE WINDOWS ARE SUPPORTED and each produces its own tag. PONS had one,
# so that path was never exercised by this token; MOS has four and USELESS three.
# Every instant carries an explicit offset -- a bare local time means a
# different moment depending on who reads it, and the runner rejects it.
windows:
  - label: PONS-P1
    start: "2026-07-21T00:00:00+00:00"
    end:   "2026-08-21T23:59:59+00:00"

rpc:
  url_template: "https://robinhood-mainnet.g.alchemy.com/v2/{key}"
  key_var: ALCHEMY_API_KEY
  request_timeout_ms: 120000

  # DENSE filters -- swaps and transfers. Measured: 100,000 blocks succeeds,
  # 250,000 is refused with "Log response size exceeded".
  max_log_span_blocks: 100000
  # SPARSE filters -- pool creation events for one token. Measured on AI:
  # 4,615 Initialize logs returned across 40,000,000 blocks in ONE call.
  sparse_log_span_blocks: 40000000
  # Below this, a size refusal is a livelock rather than something to retry.
  min_log_span_blocks: 25
  # The sweeper sizes each span to land near this many logs. Density-targeted
  # rather than fixed: re-widening to the maximum after every success made the
  # first PONS sweep thrash, and a ratchet that only narrowed starved its sparse
  # middle at 47,000 blocks per minute.
  target_logs_per_request: 6000

# Routers are identified by BEHAVIOUR, not by the hand-typed list in
# config/infrastructure.yaml. Three parts, all required: a deployed contract,
# many distinct recipients, and a high share of its sends sitting inside a swap
# transaction. The third part is the discriminator -- measured on PONS, real
# routers run 72.5-98.3% and distributors run 0.0%.
routers:
  min_recipients: 50
  min_swap_share: 0.5

venues:
  # Read from a pool's own factory() during the intake, not recalled.
  v3_factory: "0x1f7d7550b1b028f7571e69a784071f0205fd2efa"
  v4_pool_manager: "0x8366a39cc670b4001a1121b8f6a443a643e40951"

pricing:
  # A pool is in scope only when the counter side is a recognised pricing asset.
  # Applied ONCE, TO BOTH VENUES: applying it to v3 only left PONS/NVDA and
  # PONS/STONKBROKER in the v4 set, pricing a memecoin against a tokenised
  # equity through an oracle nobody verified.
  assets:
    - "0x0Bd7D308f8E1639FAb988df18A8011f41EAcAD73"   # WETH, 18 decimals
    - "0x5fc5360D0400a0Fd4f2af552ADD042D716F1d168"   # USDG,  6 decimals
    - "0x0000000000000000000000000000000000000000"   # native ETH, 18
  usd_asset: "0x5fc5360D0400a0Fd4f2af552ADD042D716F1d168"
  native_assets:
    - "0x0Bd7D308f8E1639FAb988df18A8011f41EAcAD73"
    - "0x0000000000000000000000000000000000000000"

  bucket_blocks: 10000
  # Buckets are anchored at the token's FIRST SWAP BLOCK, not at zero. Every
  # stored PONS bucket satisfies `block % 10000 == 3150` for this reason.
  # Anchoring at zero would look up 54930000 where the stored bucket is
  # 54933150, match nothing, and write a second series interleaved with the first.
  bucket_origin: 8963150
  tick_fence_multiple: 100
  native_fence_multiple: 10

floors:
  token_raw_units: 1
  paid_raw_units: 1
  # The one that is easy to omit. A USD-only floor let through a row of 1.7e-6
  # tokens carrying $980,393.99 of allocated USD -- $5.79e11 per token, and
  # 0.87% of the token's entire USD volume, invented.
  token_amount: 0.001
  # Applies ONLY to rows that have a USD value. Unpriced is not small.
  usd: 0.01

tables:
  token_usd: pons_usd_prices
  native_usd: native_usd_prices

# HARD COMPUTE-UNIT CEILING PER PHASE, set before the phase starts. An account
# cap protects the wallet; only an in-job ceiling protects against a phase whose
# scope was wrong from its first request. A phase that reaches its ceiling stops
# and reports where it stopped.
#
# The sweep and timestamp figures are sized from the PONS intake's actual
# consumption, with headroom -- not from a guess.
ceilings:
  identity: 1000
  windows: 5000
  pools: 250000
  scope: 100000
  sweep: 4000000
  conventions: 50000
  # REBUILD 2026-09-10. 16,910 candidate wallets in-window x (26 CU code check +
  # ~17.1 CU payment proof) is ~727,000 CU; the old 600,000 was sized before the
  # payment rule existed and would stop the phase two thirds through.
  cohort: 1000000
  tags: 0            # writes wallet_tags; no network
  timestamps: 2000000
  prices: 0        # derived from stored logs; no network
  dryrun: 0        # reads the database only
  write: 0         # reads the database only
