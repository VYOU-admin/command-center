# CHUMP — the FIRST V3-ONLY token through this runner.
#
# Every prior intake was v4-dominant with v4_swaps_all available to copy from.
# That shortcut does not apply here, so every v4-shaped assumption in
# docs/ROBINHOOD.md is treated as unverified for this token until checked.
# The V3-ONLY subsection of step 17's neighbour in section 8 records what
# differed, so CASHCAT does not rediscover it.

chain: robinhood
ticker: CHUMP
# Checksummed exactly as supplied and as the chain returns it. Lowercasing here
# would match no cohort, since wallet_tags.mint stores this string.
token: "0x0E0d2C89a5a019FE1cF762e5e33187631DACC21B"
# Recorded, NEVER used as a filter. Collecting only the charted pair silently
# drops every wallet an aggregator routed elsewhere.
charted_pair: "0x714442e9a611f8561a7df108d6d925132937cfb8"

# THE START BOUND IS AN INSTANT ONE SECOND BEFORE THE DEPLOYMENT BLOCK'S SECOND.
#
# The intent was "start where the token starts", and THROUGH THE RUNNER IT LANDS
# EXACTLY THERE: `resolveWindows` passes the deployment block as the search's low
# bound and `blockForInstant` opens `if (target <= loTs) return lo`, so this instant
# returns 23,791,950 itself. Verified against the stored `windows:resolved` row.
#
# CORRECTED 2026-09-13. This comment previously said the bound resolves to
# 23,791,940 -- which is what the same instant gives when the search starts at
# block 1, and is NOT what the runner produced. A config comment asserting
# something the data contradicts is the defect section 9 already records against
# `intake/index.yaml`; it is fixed here rather than repeated.
#
# An instant still cannot NAME a block here -- ten blocks share each timestamp
# (section 3) -- so a block-valued bound is recorded in section 9 as a PROPOSAL.
# It was deliberately not made inside this intake: a window bound decides cohort
# membership, metric 3 and the token_windows row.
windows:
  - label: CHUMP-P1
    start: "2026-07-31T01:44:30+00:00"     # -> block 23,791,950, measured (clamped)
    end:   "2026-08-24T12:00:00-04:00"     # -> block 44,992,963, measured

# Both pump points sit at or after the window end. That is intended; step 13's
# metric 5 distribution is reported explicitly for it.
pump_points:
  - "2026-08-24T12:00:00-04:00"
  - "2026-08-28T12:00:00-04:00"

rpc:
  url_template: "https://robinhood-mainnet.g.alchemy.com/v2/{key}"
  key_var: ALCHEMY_API_KEY
  request_timeout_ms: 120000
  max_log_span_blocks: 100000
  sparse_log_span_blocks: 40000000
  min_log_span_blocks: 25
  target_logs_per_request: 6000

routers:
  min_recipients: 50
  min_swap_share: 0.5

venues:
  v3_factory: "0x1f7d7550b1b028f7571e69a784071f0205fd2efa"
  v4_pool_manager: "0x8366a39cc670b4001a1121b8f6a443a643e40951"

pricing:
  assets:
    - "0x0Bd7D308f8E1639FAb988df18A8011f41EAcAD73"   # WETH, 18 decimals
    - "0x5fc5360D0400a0Fd4f2af552ADD042D716F1d168"   # USDG,  6 decimals
    - "0x0000000000000000000000000000000000000000"   # native ETH, 18
  usd_asset: "0x5fc5360D0400a0Fd4f2af552ADD042D716F1d168"
  native_assets:
    - "0x0Bd7D308f8E1639FAb988df18A8011f41EAcAD73"
    - "0x0000000000000000000000000000000000000000"

  bucket_blocks: 10000
  # ANCHORED ON THE EXISTING RESIDUE-3150 GRID that PONS and INDEX read.
  # Step 10: prefer an existing grid over a new one whenever the token shares a
  # series. CHUMP is WETH-quoted so it leans on the chain's ETH/USD series, and a
  # third residue would fragment it further -- section 9 already carries the two.
  bucket_origin: 8963150
  tick_fence_multiple: 100
  native_fence_multiple: 10

floors:
  token_raw_units: 1
  paid_raw_units: 1
  token_amount: 0.001
  usd: 0.01

tables:
  token_usd: chump_usd_prices
  native_usd: native_usd_prices

ceilings:
  identity: 2000
  windows: 5000
  pools: 100000
  scope: 50000
  sweep: 2000000
  conventions: 50000
  cohort: 400000
  tags: 0
  timestamps: 500000
  prices: 0
  dryrun: 0
  write: 0
