# The watcher: what the watchlist wallets trade, on ANY token on the chain.
#
# ITS OWN MONITOR, not part of wallet-scores. The watchlist REBUILD lives beside
# scoring because both are free and have no cursor; this is cursor-driven and
# spends compute units, and step 13 is explicit that coupling a free job to a
# metered one means a ceiling or a rate limit stops the free one too.
#
# MEASURED before it was built: the wallet-keyed transfer filter runs at
# 0.026492 logs/block over 120,000 blocks sampled near head, so the natural span
# at the 6,000-log target is 226,486 blocks and the 100,000-block cap binds
# instead of density. That means 6 requests per slice -- 3 wallet chunks x 2
# directions -- regardless of slice size, for 360 CU and $0.00016 a run.

id: watchlist-watch
name: Watchlist Watch
source: watchlist-watch

enabled: true

# Every 30 minutes, matching wallet-scores, so the watchlist a run uses is never
# more than one scoring cycle stale.
schedule: 30m

alerts:
  # FAILURES go to system like every other monitor. The activity alert itself is
  # routed from inside the adapter to the `crypto` channel, which is the Discord
  # channel #crypto-screener -- the webhook named "Crypto",
  # DISCORD_WEBHOOK_CRYPTO, already registered. Nothing new was created.
  channel: system
  discord_on_consecutive_failures: 2

options:
  chain: robinhood
  # Supplies the venues, the pricing assets and the bucket width. INDEX's config
  # is used because it reads the residue-3150 native grid; the watcher's own
  # lookup is nearest-preceding-bucket, so the anchor does not bind it.
  config: intake/index.yaml
  # 30 minutes is ~17,800 blocks at 35,622 blocks/hour. 20,000 keeps the cursor
  # moving slightly faster than the chain so a missed run catches up.
  slice_blocks: 20000
  # ~200 blocks, so a reorg at the tip cannot strand rows. Step 15: this chain's
  # actual reorg depth has never been measured -- it is a margin, not a finding.
  head_lag: 200
  # Measured at 360 CU a run for the transfer filters plus the Swap filters. The
  # first runs also classify every pool the watchlist touches, one-off, so the
  # ceiling has room for that and still stops a run whose scope went wrong.
  ceiling: 100000

  # ---- the SECOND alert: tokens that just launched --------------------------
  #
  # A separate message to the same `crypto` channel on the same run. The first
  # alert is unchanged and still posts first; this one asks which tokens that
  # LAUNCHED IN THE LAST HOUR the watchlist wallets bought.
  #
  # ITS FILTER WAS MARKET CAP UNTIL 2026-09-15 AND WAS DROPPED ON EVIDENCE, not
  # forgotten -- see step 17. Both terms of that figure are approximations: total
  # supply is not circulating supply, and the slice-implied price is a
  # volume-weighted average over one wallet set's trades in ~10,000 blocks that
  # the document forbids comparing against a stored price bucket. Its own
  # measurements agreed: the derivable market caps sat between $16.7M and $571M
  # with no boundary in them, $200,000 and $150,000 selected the same three
  # tokens, and 439 of 693 tokens had no USD route for it to see at all.
  # Market cap is still DISPLAYED in the alert. It filters nothing.
  #
  # THE WINDOW IS IN MINUTES AND THE BLOCK COUNT IS DERIVED FROM THE MEASURED
  # BLOCK TIME, never written here as a block count. At 35,622 blocks/hour
  # (measured, section 3) 60 minutes is 35,622 blocks, and the derived figure is
  # logged on every run so a change in block time shows up as a changed window
  # rather than as a silently wrong one.
  launch_window_minutes: 60

  # THE ONLY VARIABLE TERM IN THIS ALERT'S COST. The base check is one
  # eth_getCode per novel token (26 CU) and is bounded by the novel-token rate,
  # which the chain decides -- measured at 437 buy-side novel tokens on
  # 2026-09-14, the only complete non-seeding day, over 48 runs = 9.1 per run =
  # 237 CU per run. The BISECT is 16 more calls plus a block read (436 CU) and is
  # bounded by how many of those are genuinely new, which nothing bounds in
  # advance. 25 is ~10x the measured per-run rate: it cannot bind on a normal run
  # and does bind on a pathological one. It is reported in the log whenever it
  # binds, and the tokens it skipped are left unwritten so the next run re-asks
  # them rather than recording a guess.
  age_bisects_per_run: 25

  # SUPPLY IS CACHED LIKE DECIMALS AND EXPIRES UNLIKE DECIMALS. A mint or a burn
  # changes totalSupply, so a permanent cache goes stale silently. Read once on
  # first sight, re-read after this many days, and `supply_read_at` carries the
  # timestamp so staleness is visible rather than assumed.
  supply_ttl_days: 7

  # Bounded per run so a backlog cannot turn one 30-minute cycle into a
  # 1,220-token job against the shared ceiling above. At ~474 newly-seen tokens a
  # day plus the weekly re-reads, a typical run needs ~14 of these; the cap is
  # room for a backlog to drain over a few cycles. 200 x 26 CU = 5,200 CU.
  supply_reads_per_run: 200
