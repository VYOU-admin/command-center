# TEMPORARY — exercises the recovery-alert path, then gets deleted.
#
# Deliberately reuses the id `alert-test`, whose registry row is still sitting
# at 12 consecutive failures with failure_alert_sent = true from the failure
# test. Pointing it at a working feed means the next successful run has to
# cross the recovery edge: clear the streak, send the "working again" alert,
# and reset the flag so a future incident can alert again.

id: alert-test
name: Alert Test (recovery)
source: rss
enabled: true
schedule: 30s

options:
  url: https://www.coindesk.com/arc/outboundfeeds/rss/?outputType=xml
  timeout_ms: 20000

alerts:
  discord_on_consecutive_failures: 3

dashboard:
  window_hours: 24
