# Group 2 high-PnL wallets buying tokens that just launched.
#
# A NARROWER new-token-watch, not a replacement. That monitor watches 6,344
# wallets from three union rules; this watches the 331 Group 2 wallets whose
# realized PnL is at or above min_realized_pnl_usd -- a strict subset (all 331
# are already on the old list) and about 19x smaller.
#
# MEASURED IN A LIVE DRY RUN (2026-09-02, chain 4663):
#   331 watchlist wallets -> 2 chunks -> 13 requests, 50.9 s, 17% of the spine's
#   300 s ceiling. The old monitor needed 4-way staggering to fit at all and
#   still exceeded 300 s on 6 of its 25 recorded cycles, so there is no
#   staggering here: at 2 chunks it would delay detection by up to 45 minutes
#   and save nothing.
#   Funnel that run: 1,034 inbound transfers -> 541 venue transfers -> 80 tokens
#   detected -> 16 eligible on pool age -> 16 with a watchlist buyer -> 15
#   alerted, 1 omitted for having no DexScreener pair.
#
# KNOWN LIMITATION -- V3 LAUNCHES ARE INVISIBLE. Detection keys entirely off the
# v4 PoolManager's Initialize event, so a token launched only on a v3 factory
# pool is never seen. This is demonstrable, not theoretical: PONS is recorded as
# uniswap v3 with a 20-byte pool address, while token_pool_first holds a
# different, later v4 poolId for it -- the sweep never saw its real launch.
# Covering v3 needs each factory address and its PoolCreated topic. THE SIZE OF
# THE GAP HAS NOT BEEN MEASURED and should not be guessed at.
#
# A TRANSFER IS NOT A BUY: only transfers sent BY the PoolManager count, which
# is also what makes attribution independent of tx.from -- the trader on this
# chain only about 46% of the time. Measured on the old monitor: 26.5% of
# inbound transfers survive that filter.

id: group2-new-token
name: Group 2 New Token
source: group2-new-token
enabled: true

schedule: 5m

alerts:
  # Content alerts go to DISCORD_WEBHOOK_NEWTOKEN. Failure and recovery alerts
  # go to system regardless, which the spine routes independently.
  channel: newtoken

options:
  chain: robinhood
  # Every call here is served by the free public endpoint; no API key needed.
  rpc_url: https://rpc.mainnet.chain.robinhood.com
  pool_manager: "0x8366a39cc670b4001a1121b8f6a443a643e40951"

  # Topic hashes are COPIED FROM WORKING CODE, never recalled.
  initialize_topic: "0xdd466e674ea557f56295e2d0218a125ea4b4f0f6f3307b95f85e6110838d6438"
  transfer_topic: "0xddf252ad1be2c89b69c2b068fc378daa952ba7f163c4a11628f55a4df523b3ef"
  # The v4 PoolManager Swap event. ESTABLISHED EMPIRICALLY, not recalled: across
  # 65 receipts of confirmed watchlist buys it was the only PoolManager topic
  # present, appearing exactly once per receipt, with the poolId in topic1.
  # topics[1] of this event is the pool the wallet actually traded, which is what
  # the alert links -- the Initialize sweep picks the EARLIEST pool created for a
  # token, and measured on the 07:42 cycle that was the wrong pool for 6 of 15.
  swap_topic: "0x40e9cecb9f5f1f1c5b9c97dec2917b7ee92e57ba5563708daca94dd84ad7112f"

  # Receipts per batched JSON-RPC request. Fetched only for tokens that already
  # passed the re-alert rule: measured 2 candidates / 20 transactions on the
  # 08:13 cycle = 1 extra request, and at most 7 on a cold cache.
  receipt_batch: 25

  # RECEIPT PHASE THROUGHPUT. Measured over ten cycles, wall-clock tracks
  # (requests - 1) x interval to within a second, so the cycle is pacing-bound
  # and receipts were 60% of the requests in the last completed cycle.
  #
  # Concurrency alone cannot help while one global spacing governs every
  # request: throughput is 1/interval whatever the concurrency. So both knobs
  # are here, and the receipt phase no longer shares min_interval_ms.
  #
  # concurrency 2, NOT 4: the endpoint's concurrency limit is UNMEASURED and
  # undocumented. What IS measured is its rate tolerance for eth_getLogs -- 0 of
  # 20 refused at 4,000 ms, 6 of 20 at 2,500 ms -- and cycles at 16:22 and 16:37
  # already lost 187 s and 124 s to 429/5xx backoff at the current pacing. So
  # this starts conservative and receipt_rate_limited is recorded every cycle.
  receipt_concurrency: 2
  receipt_interval_ms: 2000

  # Most receipts to fetch for any ONE token per cycle. Measured on a live
  # window: 21 tokens, 338 qualifying transfers, median 5, p90 33, max 165 --
  # the single hottest token was 48.8% of the whole receipt bill. A cap of 50
  # truncates 1 token and cuts 14 requests to 9. A truncated token is recorded
  # in the truncations column with what it saw against what was fetched; its
  # pool choice is then a SAMPLE, never presented as a census.
  receipt_cap_per_token: 50

  # The watchlist rule: Group 2 wallets at or above this realized PnL, in USD,
  # across all six Robinhood tokens, deduplicated. Currently 331 wallets.
  # Realized, not realized+unrealized: Group 2 is "bought and sold", so realized
  # is what these wallets actually did. At 1000 that is 334 rows against 422.
  min_realized_pnl_usd: 1000

  # Line 1 of every alert. Read from config because AdapterContext carries no
  # public URL -- env.publicUrl is only wired into the system alerter.
  dashboard_url: "https://command-center-production-eab2.up.railway.app/cate"
  # DexScreener's chain slug, verified live: a pair resolves at
  # https://dexscreener.com/robinhood/<v4 poolId or v3 pool address>.
  # A TOKEN address is not a valid pair address and returns nothing.
  dexscreener_chain: robinhood

  # Eligibility window. 60, not 120: measured on a live window, the 60-120m
  # band held 29.4% of eligible TOKENS but only 13.9% of the qualifying
  # transactions, and transactions are what the receipt phase costs. A pool
  # first swept in this cycle is admitted whatever its age, so shortening this
  # cannot make a launch missed during downtime unrecoverable.
  max_pool_age_minutes: 60
  lookback_hours: 1
  # Only needs to exceed max_pool_age_minutes. Anything older than the swept
  # range is dropped by the age rule anyway, so a longer bootstrap buys nothing
  # and risks the run ceiling.
  bootstrap_hours: 3

  # Measured ceilings on this chain: >1,000 topic selectors is rejected, 500
  # addresses over 2,000 blocks times out, 200 over 10,000 blocks is reliable.
  watchlist_chunk: 200
  transfer_block_window: 20000
  sweep_block_window: 20000
  # 4,000 ms is the MEASURED point where 429s stop on this endpoint: at 800 ms
  # 15 of 20 requests were refused, at 2,500 ms 6 of 20, at 4,000 ms none.
  min_interval_ms: 4000

  # Set false to run a populating cycle without sending. Note this also holds
  # back the group2_token_alerts high-water mark, so a muted cycle does not
  # suppress the alert it would have sent.
  send_alerts: true
