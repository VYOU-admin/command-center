# MOS-P1: what the tagged cohort holds, and what it has just started holding.
#
# Began as a 10-wallet cost probe with no Discord. It now reads all 74 wallets
# tagged MOS-P1 and alerts to the new-token channel.
#
# BOTH TOKEN PROGRAMS. getTokenAccountsByOwner takes one programId, so covering
# legacy SPL Token and Token-2022 needs two sub-calls per wallet -- 148 in all.
# Querying only the legacy program returns NOTHING for MOS, which is Token-2022:
# measured, 0 accounts on the legacy filter for this mint.
#
# ALERTS ARE NOT THE FLAG SET. The balance diff still flags percentage moves and
# stage 3 still pulls their activity, but only mints crossing a wallet-count
# high-water mark are ever sent. Measured over four cycles, USDC moves alone
# accounted for most of the flag rate, which is shuffling rather than signal.

id: mos-p1-test
name: MOS P1 Cohort
source: mos-p1-test
enabled: true

schedule: 15m

alerts:
  # Content alerts: the cohort-activity lines. Failure and recovery alerts go to
  # the system channel regardless of this setting.
  channel: newtoken

options:
  rpc_url: "https://mainnet.helius-rpc.com/?api-key=${HELIUS_API_KEY}"
  tag: MOS-P1

  # THE PROVIDER CAPS A BATCH BETWEEN 28 AND 32 SUB-CALLS. Measured on this key:
  # 20, 24 and 28 return HTTP 200; 32, 40, 100 and 148 return HTTP 429 within
  # ~20ms, and 40 stayed refused across three attempts with 12s backoff -- a
  # size ceiling, not a rate limit. 148 sub-calls go as 8 chunks of 20, spaced
  # below; measured 8/8 clean in 40.7s. Above 28 fails validation at boot.
  batch_subcalls: 20
  batch_interval_ms: 5000

  # A mint must be held by at least this many cohort wallets to be alertable.
  # Of the 5,902 mints the cohort holds with a positive balance, 5,413 are held
  # by exactly one wallet and the tail is airdrop and LST dust with totals like
  # 0.02. A floor of 2 leaves ~489 candidates.
  min_holders: 2

  # Never alertable at any holder count. Stablecoin and wrapped-SOL movement is
  # cohort plumbing, and USDC alone is held by 40 of the 74 wallets.
  denylist_mints:
    - EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v   # USDC
    - Es9vMFrzaCERmJfrF4H2FYD4KCoNkY11McCe8BenwNYB   # USDT
    - So11111111111111111111111111111111111111112    # wrapped SOL

  # Symbols are resolved one request per alertable mint, for lines that will
  # actually be sent. A mint past this cap still gets a line, just unlabelled --
  # dropping it would leave its high-water mark unraised and lose it silently.
  dexscreener_cap: 60
  dexscreener_interval_ms: 250

  # A mint whose balance moves more than this flags the wallet for stage 3. A
  # NEW mint always flags regardless of size: there is no prior balance to take
  # a percentage against. Flagging drives activity capture, NOT alerting.
  move_pct: 5

  # Stage 3 pulls this much history, for flagged wallets only.
  activity_minutes: 30
