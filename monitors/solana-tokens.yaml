# DISABLED 2026-08-25.
#
# Collection stopped by request. Focus has moved to the pump.fun early-window
# work, and this monitor's DexScreener-based scanning of already-listed tokens
# answers a different question from "what does a launch do in its first ten
# minutes".
#
# It also grew ~8.8 MB/day with no retention policy — 3.2 GB/year — which made
# it the next thing after early_snapshots to fill the volume.
#
# ALL TABLES ARE KEPT: solana_tokens, solana_token_observations and
# solana_top_membership are untouched and remain queryable. Existing analyses
# (ALERT_OUTCOMES.md and the rest) stay reproducible; only new collection stops.
#
# NOTE: this monitor also READ pump_launches, to seed its watch list from
# recent graduates. That source is disabled too, so the dependency lapses
# together rather than leaving a monitor reading a table nothing updates.
# Solana new-token tracking.
#
# Two ingest stages, both free and key-less:
#   1. DexScreener  — discover newly-listed Solana tokens, poll metrics for the
#                     whole tracked universe.
#   2. RugCheck     — for candidates clearing every hard floor below, pull
#                     authority / LP / holder data, then score.
#
# Everything you are likely to tune lives in this file, not in the code.

id: solana-tokens
name: Solana Tokens
source: solana-tokens
enabled: false
schedule: 1h

options:
  # Candidacy window, measured from the pair's creation time.
  # NOTE: this gates *scoring only*. Tokens keep being observed long past
  # max_age_hours, because "did it still have liquidity at day 7" needs day-7
  # rows to exist.
  min_age_hours: 6
  max_age_hours: 168 # 7d

  # HARD FLOORS — disqualifying, all must pass. Set any to 0 to disable it.
  floors:
    liquidity_usd: 15000
    volume_24h_usd: 25000
    volume_to_mcap: 0.30
    liquidity_to_mcap: 0.10
    txns_1h: 100

  # Scoring weights. Relative, normalised to 100 — they need not sum to 100.
  # Authorities and LP dominate deliberately: they are the difference between
  # "risky" and "the deployer can take the money whenever they like".
  weights:
    mint_renounced: 25
    freeze_renounced: 10
    lp_locked: 25
    holder_distribution: 15 # top-10 concentration, penalised for insiders
    liquidity_depth: 10 # liquidity as a fraction of market cap
    dispersion: 15 # holder count — see note below

  scoring:
    # A live mint authority means supply can be inflated at will, so it is
    # treated as near-disqualifying rather than merely penalised: the whole
    # score is multiplied by this.
    mint_not_renounced_multiplier: 0.25
    # liquidity/mcap ratio that earns full marks for depth.
    liquidity_depth_target: 0.4
    # Holder count that earns full marks for dispersion (log-scaled).
    #
    # Dispersion uses holders rather than unique trading wallets because no free
    # API exposes unique traders. Holders are rent-funded on-chain accounts that
    # cost real SOL to create, so they are far harder to fake than transaction
    # counts — which volume bots inflate in lockstep with volume itself.
    dispersion_holder_target: 2000
    # RugCheck's holder fields are unreliable — the same mint returns 22,000
    # holders one hour and 0 the next. Scoring an absent value as zero would
    # conflate "badly distributed" with "not visible", so the score is the
    # weighted average over whatever WAS measurable, and `completeness` records
    # what fraction of the weight that covered. Tokens below this floor are
    # observed and stored but left unscored.
    min_completeness: 0.5

  # Where the candidate universe comes from.
  discovery:
    # Pull graduated tokens from the pump.fun launch monitor.
    #
    # DexScreener's only free path to new tokens is its "latest profiles/boosts"
    # feeds, which list tokens whose developers PAID for visibility — so a
    # universe accumulated from them alone over-represents launches with a
    # marketing budget. Graduates are selected by the market instead.
    #
    # Set to an empty value to disable and fall back to the feeds alone. If the
    # launch monitor is not deployed its tables will not exist, and discovery
    # logs a warning and carries on rather than failing.
    pumpfun_monitor_id: pumpfun-launches
    # Matches max_age_hours below: a token older than the scoring window would
    # enter the universe already past candidacy.
    graduate_lookback_hours: 168

  limits:
    # Universe cap. Newly discovered tokens always take priority over the tail.
    #
    # Raised from 400 when graduate discovery was added: pump.fun graduates run
    # at roughly 50-150/day, so a 7-day lookback contributes up to ~1000 mints
    # on its own and the old cap would have evicted them within days. At 30
    # addresses per DexScreener request this is ~40 requests per run.
    max_tracked: 1200
    # RugCheck calls per run. Deepest-liquidity candidates are enriched first.
    max_enrich_per_run: 25
    request_delay_ms: 250
    timeout_ms: 20000

  alerts:
    top_n: 20
    # A token that drops out and comes straight back will not re-alert until it
    # has been outside the top N for this long, so boundary oscillation cannot
    # spam the channel.
    re_entry_cooldown_hours: 24

alerts:
  # Spine-level: consecutive run failures for the monitor itself. These go to
  # the system channel regardless of what is set below — an outage should
  # surface in one place, not scattered across topic feeds.
  discord_on_consecutive_failures: 3
  # Where this monitor's CONTENT alerts go (top-N entry). Resolves to
  # DISCORD_WEBHOOK_CRYPTO, falling back to DISCORD_WEBHOOK_URL if unset.
  channel: crypto

dashboard:
  window_hours: 24
