# MOS price: an hourly heartbeat and an immediate all-time-high alert.
#
# ONE DexScreener READ PER CYCLE, no RPC. The pair is the DYN2 MOS/USDC pool,
# which holds 99.7% of all MOS liquidity -- the other four MOS pools hold ~$950
# between them and quote wildly different prices.
#
# A FAILED READ IS NOT A PRICE. It is recorded with price_usd null so the
# failure is visible, then it is inert: no change is computed from it, nothing
# compares against it, and it can never raise the high-water mark. Treating a
# missing price as 0 would fire a false ATH on the next good read; treating it
# as unchanged would silently freeze the mark.
#
# THE HEARTBEAT STILL FIRES AFTER A FAILURE, reporting the last good reading and
# saying when it was taken. Skipping the hour is indistinguishable from the
# monitor being dead, which is the one thing a heartbeat exists to rule out.

id: mos-price
name: MOS Price
source: mos-price
enabled: true

schedule: 5m

alerts:
  # Shared with the new-token and balance-change alerts. Each header is a
  # distinct noun phrase so the four kinds are told apart at a glance:
  #   GROUP 1 · bought and held        -- group1 new-token buys
  #   (no header, leads with a link)   -- group2 new-token buys
  #   MOS · GROUP 1 BALANCE CHANGES    -- cohort balance moves
  #   MOS · PRICE · HOURLY             -- this heartbeat
  #   MOS · NEW ALL-TIME HIGH          -- this ATH
  # Its OWN channel, #mos-price-alert, not the shared newtoken one. The webhook
  # comes from MOS_PRICE_CHECK, which does not follow the DISCORD_WEBHOOK_<NAME>
  # convention and is therefore registered by an explicit alias in env.ts. If
  # that variable were ever unset the channel would not resolve and the sink
  # would fall back to DISCORD_WEBHOOK_URL -- /health reports via:"fallback"
  # when that happens, so the misrouting is visible rather than silent.
  channel: mos-price-alert

options:
  token: MOS
  chain: solana
  # The DYN2 MOS/USDC pool. Lowercase f in ...ScEYfTWiWh -- base58 is
  # case-sensitive and the capitalised form is a different, non-existent address.
  pair: "gjL62zuUAdJm7cZhrWtnBoCGN31kSFyWHScEYfTWiWh"
  dexscreener_chain: solana

  # How often the heartbeat goes out, independent of the 5m read cadence.
  heartbeat_minutes: 60

  # Set false to read and record without sending. The high-water mark still
  # advances; only the Discord posts and the heartbeat clock are held back.
  send_alerts: true
