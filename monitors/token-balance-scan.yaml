# Repeated balance readings for wallets that bought and held.
#
# Scope is defined by the seeded 'window_close' rows in token_balance_scans, not
# by a query: Group 1 membership depends on transfer logs that are not in the
# database, and the closest SQL proxy returns 119 of 266 ODYSSEUS wallets.
#
# ONE ROLLING SWEEP, NOT A PER-TOKEN SCHEDULE. A pass consumes wallet_budget
# wallets from a single (token, wallet) ordering across all six seeded tokens
# and resumes from balance_scan_cursor next pass, so a pass may span two tokens
# and may span the end of one sweep and the start of the next.
#
# The per-token schedule this replaced could not survive a cursor: it asked
# max(scanned_at) per token, so reading one wallet of a token marked the whole
# token scanned and the rest of it was never picked up.
#
# Per-pass cost, measured basis: 400 wallets / 20 per batch = 20 requests plus 2
# for head and its timestamp = 22 requests. At 4,000 ms pacing plus the ~1,355 ms
# per-request latency measured on the one clean pass, that is 114 s, 38% of the
# spine's 300 s ceiling. A full sweep of 2,991 wallets is 8 passes; at a 10m
# schedule measured finish-to-start, that is roughly 1.4 hours.

id: token-balance-scan
name: Token Balance Scan
source: token-balance-scan
enabled: true

# The cursor decides what is read, so this is simply how often a slice is taken.
schedule: 10m

alerts:
  channel: system

options:
  chain: robinhood
  rpc_url: https://rpc.mainnet.chain.robinhood.com

  # Wallets consumed per pass. Bounded 50..1000 by the adapter: below 50 the two
  # fixed overhead requests cost more than a fifth of the pass, above 1000 the
  # pass cannot fit the 300 s run ceiling.
  wallet_budget: 400

  # 4,000 ms is the measured point where this endpoint stops returning 429s.
  # A batch is one request, so the pacing applies per batch.
  min_interval_ms: 4000
  batch_size: 20
