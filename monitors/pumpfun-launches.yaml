# DISABLED 2026-08-25.
#
# Superseded by pumpfun-early-window, which now records EVERY launch from t=0
# rather than a sample, carries buyer and seller identity that this monitor's
# accountSubscribe design structurally cannot provide, and takes launches from
# the same program-wide log subscription as trades instead of a second feed.
#
# This monitor's per-token accountSubscribe approach is also the one bounded by
# the RPC's 100-concurrent-subscription cap, which is what motivated the
# program-wide design in the first place. It had additionally been failing 508
# of 1,245 runs before the outage that prompted this change.
#
# ALL TABLES ARE KEPT: pump_launches, pump_curve_samples, pump_velocity_summary
# and pump_deployer_stats are untouched and remain queryable. Existing analyses
# stay reproducible; only new collection stops.
#
# pumpfun-outcomes still reads these tables and is deliberately left running so
# tokens already in flight can resolve. It should be disabled once they have.
# pump.fun launch stream.
#
# PURPOSE: logging and dataset building. This monitor ranks nothing and signals
# nothing. At the current platform-wide graduation rate of roughly 0.2%, any
# live ranking drawn from a few days of collection would be noise.
#
# Unlike the other monitors this one is not a poll. Two websockets are held open
# by the adapter and the schedule below is the DRAIN interval — how often
# buffered events are committed — not a request rate.
#
#   PumpPortal  subscribeNewToken   -> every launch          (free, no API key)
#               subscribeMigration  -> every graduation      (free, no API key)
#   Solana RPC  accountSubscribe    -> one push per trade on a token's bonding
#                                      curve, which is how per-trade velocity is
#                                      measured without paying for a trade feed.
#                                      PumpPortal's own subscribeTokenTrade is
#                                      metered at 0.01 SOL / 10k events, which is
#                                      not viable at ~70k launches/day.

id: pumpfun-launches
name: Pump.fun Launches
source: pumpfun-launches
enabled: false

# Drain interval. Shorter means less data at risk if the process dies between
# drains; the shutdown hook performs a final drain on SIGTERM either way.
#
# NOTE: the effective interval is 60s, not 30s. The scheduler ticks every 30s
# and only runs a monitor once its full schedule has elapsed, so a 30s schedule
# lands on every second tick. 30s is the configured floor, so 60s is the fastest
# drain achievable without lowering the global tick. This is harmless here — a
# drain carries ~30 launches and ~400 samples against a 20k buffer — but it does
# mean up to 60s of events are in memory rather than committed.
schedule: 30s

options:
  pumpportal_url: wss://pumpportal.fun/api/data
  # Public RPC works and needs no key. Swap in a provider URL for more headroom;
  # the concurrent-subscription cap below is the thing that would change.
  rpc_url: wss://api.mainnet-beta.solana.com

  # Liveness for the long-lived sockets, measured by DATA ARRIVING rather than
  # by socket state. A half-open socket — the peer gone without sending a FIN,
  # routine behind cloud NAT — stays readyState OPEN forever and never fires a
  # close event, so a reconnect-on-close design never recovers from it. The
  # pump.fun launch feed sat dead this way for 4.7 hours in production while
  # reporting itself connected. After this many seconds of silence the socket is
  # force-closed and reconnected. Both streams here are orders of magnitude
  # busier than this threshold, so it cannot fire on a merely quiet period.
  stream_silence_reconnect_seconds: 120


  sampling:
    # SLOT ARITHMETIC — retune these together. They trade against one capped
    # resource: concurrent bonding-curve subscriptions, hard-limited to 100 by
    # the RPC. Figures below are MEASURED off the live stream, not estimated.
    #
    # SLOT BUDGET. Measured at a 4-minute window: median 38 concurrent, p90 56,
    # PEAK 78 of 95, zero denials. Peak runs about 2x median, so bursts are what
    # size this, not the average.
    #
    # Shortened to 3 minutes to buy slots for a larger control group. That costs
    # nothing this monitor is currently measuring: the snapshots are taken at
    # 30/60/120s, so 180s of observation covers all of them with 50% margin, and
    # the 4th minute was contributing tail that no configured feature reads.
    #
    # Freed ~25% of slot-time (projected peak 78 -> ~59), which is then spent on
    # control_sample_rate below. Projected peak after both changes: ~79 of 95.
    #
    # Denials are not a crash — instrument() refuses to exceed the cap, so the
    # connection is never at risk of a 1013 close. The cost is subtler: a denied
    # token is silently unsampled, and denial happens precisely when launch rate
    # is highest, so the gap correlates with platform activity instead of being
    # random. Watch for "curve subscription slots exhausted" in the logs.
    dense_window_minutes: 3

    # Initial market cap above the 30 SOL platform default is the strongest
    # single t=0 predictor in the survival literature (Cox HR 4.51), so these
    # are always instrumented.
    instrument_mcap_sol_above: 32

    # Telegram presence carries an 8.94x graduation lift. Socials arrive a beat
    # after the launch event, so these subscribe slightly late.
    instrument_if_telegram: true

    # THE CONTROL GROUP. Launches that fail every filter above, instrumented
    # anyway at this rate. Without it the dataset could only ever describe
    # tokens the filter already liked, and the filter itself would be
    # unfalsifiable. Membership is a hash of the mint, not a coin flip, so it is
    # reproducible months later.
    #
    # Raised from 0.06 to 0.15 (~2.5x), funded by the shorter window above.
    # At ~48.7 launches/min this samples ~6/min, or ~8,000/day, which at the
    # platform's ~0.2% base rate should yield on the order of 15 control
    # graduations per day — enough that within a week the filtered and control
    # arms can be compared with something better than an anecdote.
    #
    # This is the single most important number here for answering "is the
    # filter doing anything", because that question can only be answered
    # against launches the filter rejected.
    control_sample_rate: 0.15

  # Age at which a launch enters the graduation-rate cohort. Must match
  # pumpfun-outcomes' unobserved_death_after_hours: that is when a token we
  # never instrumented is finally called dead, so it is the point at which the
  # cohort is fully resolvable.
  #
  # A rate cannot be taken over "resolved launches". Graduation is observed in
  # seconds but death is only declared after 60 minutes of curve silence, so
  # the resolved set fills with graduations first — which briefly showed a
  # graduation rate of 100% on the live dashboard for a ~0.2% phenomenon.
  # Until the cohort matures, no rate is displayed at all.
  rate_cohort_hours: 24

  limits:
    # The RPC closes the connection with code 1013 on the 101st concurrent
    # subscription — measured, not documented. This leaves headroom.
    max_curve_subscriptions: 95
    metadata_timeout_ms: 5000
    metadata_concurrency: 6
    max_buffered_events: 20000
    # Launches run at ~50/min, so a multi-minute silence means broken even
    # though the socket is connected. This is the failure a liveness check on
    # the connection alone would miss entirely.
    silence_fail_after_seconds: 300

alerts:
  # Silent by default. Failure and recovery only — no per-launch alerts, and
  # those failure alerts go to the system channel regardless of the channel set
  # below. The channel is declared anyway so that if this monitor ever does emit
  # content alerts they land in the right place rather than defaulting to system.
  discord_on_consecutive_failures: 3
  channel: crypto

dashboard:
  window_hours: 24
