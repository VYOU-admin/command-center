# Recurring wallet scoring, every token and every window.
#
# ITS OWN MONITOR, NOT PART OF THE HOURLY JOB. The hourly job is per token and
# cursor-driven; scoring is per (token, window), has no cursor, reads the
# database only, and must cover windows a token-scoped job cannot see. Coupling
# them would mean a token with no hourly monitor is also never scored -- which is
# how AI went a month without one -- and a rate limit on ingestion would stop
# scoring too.
#
# EVERY SCORE WAS FROZEN AT INTAKE before this existed: scored once, by hand,
# while rows kept arriving hourly. PnL, hold time, buy count and total USD in all
# move with every new row.

id: wallet-scores
name: Wallet Scoring
source: wallet-scores

enabled: true

# Every 30 minutes. The hourly jobs land rows on the hour; this runs often
# enough that a score is never more than one cycle behind the rows it describes,
# and it costs no compute units at all -- it reads the database only.
schedule: 30m

alerts:
  channel: system
  discord_on_consecutive_failures: 3

options:
  # THE WATCHLIST CUT, as a fraction. 5% is 0.05, not 5.
  #
  # Not measured and not measurable: there is no natural break in the score
  # distribution to cut at, so this is an operator preference. Measured
  # sensitivity across the four scored windows, merged and deduplicated:
  # 1% -> 246 wallets, 2% -> 483, 5% -> 1,176, 10% -> 2,354.
  #
  # The cut is taken PER WINDOW and merged as a union. Scores are min-maxed
  # within their own cohort so they do not compare across windows -- INDEX-P1's
  # 5% cutoff of 0.6689 sits above PONS-P1's MAXIMUM of 0.6025. Raising this
  # number admits more wallets per window; it never re-ranks across them.
  watchlist_top_percent: 0.05

  # REQUIRED AND EXPLICIT. Without it this scored MOS and USELESS -- Solana
  # tokens -- from a Robinhood monitor, and their raising for want of pump points
  # was written down as correct behaviour. It was a scoping defect. A Solana
  # scoring monitor is a second config, not a default.
  chain: robinhood
