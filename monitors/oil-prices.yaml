# Home heating oil prices.
#
# Scrapes CT-area dealers and the CashHeatingOil listing site every 15 minutes,
# append-only. Sources fail independently: one site changing its HTML does not
# stop the others storing, and a source that keeps failing alerts on its own to
# the system channel rather than hiding inside a run that looks successful.

id: oil-prices
name: Oil Prices
source: oil-prices
enabled: true
schedule: 15m

options:
  user_agent: "command-center-oil-monitor/1.0 (+https://github.com/VYOU-admin/command-center)"

  # Quantity the dashboard and the daily digest normalise to. 150 is the only
  # figure nearly every source quotes cleanly, so no number has to be derived.
  compare_gallons: 150

  # CashHeatingOil hides dealer names, so a listing is identified by its own
  # blurb. Matched on a distinctive phrase rather than the whole paragraph, so
  # the dealer editing the rest of it does not silently drop the tag.
  company_blurbs:
    - company: FJBOil
      phrase: "friendly prompt service and great prices"

  # RETENTION. Prices move about once a day but are sampled every 15 minutes, so
  # ~95 of every 96 rows per quote restate the one before it.
  #
  # Recent rows are kept whole because that is what the attached CSV reads.
  # Older rows keep, per quote per day: the first row of each distinct price run,
  # the daily high, the daily low, and the day's last row. A price with a start
  # and an end is a step function, so what survives reconstructs the series
  # exactly rather than approximating it.
  #
  # oil_price_history — McKinley's own daily series back to 2008 — is never
  # touched by this and cannot be.
  # The two Excel exports. cashheatingoil.xlsx is deliberately narrow: one
  # band, cash only, the two cheapest dealers per zip, plus FJB's own row
  # whenever FJB is not already in that top two — the file exists to compare
  # against FJB, so omitting FJB when it ranks third would hide the subject.
  exports:
    cash_source_id: cashheatingoil
    fjb_company: FJBOil
    band_min: 100
    band_max: 149
    top_n: 2
    # Ping once after a wipe even though the change list is empty by
    # construction, so a clean first run does not produce files silently.
    force_first_ping: true

  retention:
    # oil_observations rolls a 24-hour window: appended continuously, anything
    # older pruned each run. No daily archive file is kept — the workbooks are
    # produced per run and oil_price_history holds the long series.
    full_resolution_hours: 24
    max_rows_per_pass: 20000

  sources:
    # ---------------------------------------------------------------- listings
    - id: cashheatingoil
      label: CashHeatingOil
      kind: cashheatingoil
      enabled: true
      # The zip -> slug is resolved by POSTing the site's own lookup form and
      # following the redirect, never by guessing that 06716 means "wolcott".
      url: https://www.cashheatingoil.com/cod_oil_prices.php
      site_url: https://www.cashheatingoil.com/
      # Quoted: YAML reads an unquoted 06716 as the number 6716.
      zips:
        - "06010" # Bristol
        - "06716" # Wolcott
        - "06457" # Middletown
        - "06492" # Wallingford
        - "06786" # Terryville
        - "06770" # Naugatuck
        - "06705" # Waterbury

    # ------------------------------------------------------------- direct sites
    - id: mckinley
      label: McKinley Oil
      kind: mckinley
      enabled: true
      url: https://mckinleyoil.com/
      site_url: https://mckinleyoil.com/
      # A 1990s frameset: the homepage holds no prices, only <frame> tags.
      extra_urls:
        today: https://mckinleyoil.com/home-todays%20price.html
        history: https://mckinleyoil.com/home%20-%20historical%20chart.html
      backfill: true


    - id: incredible
      label: Incredible Oil
      kind: vendor
      enabled: true
      url: https://www.incredibleoil.com/
      extract:
        - anchor: "Today's Heating Oil Prices"
          window: 16
          product: fuel_oil

    - id: purplefuels
      label: PurpleFuels
      kind: vendor
      enabled: true
      url: https://www.purplefuels.com/heating-oil/pricing
      site_url: https://www.purplefuels.com/
      extract:
        - anchor: "Straight-forward pricing"
          window: 22
          product: fuel_oil

    - id: phillips
      label: Phillips Oil
      kind: vendor
      enabled: true
      url: https://phillipsoilllc.com/
      extract:
        - anchor: "Heating Oil Prices"
          window: 20
          product: fuel_oil
        - anchor: "Propane Prices"
          window: 26
          product: propane

    - id: pricerite
      label: PriceRite Oil
      kind: vendor
      enabled: true
      url: http://www.priceriteoil.net/
      extract:
        - anchor: "TODAY'S PRICE IS"
          window: 4
          product: fuel_oil
          default_gallon_min: 100
        - anchor: "Propane Price:"
          window: 8
          product: propane

    - id: dime
      label: Dime Oil
      kind: vendor
      enabled: true
      url: https://www.dimeoilco.com/
      extract:
        - anchor: "Today's Price:"
          window: 3
          product: fuel_oil
          default_gallon_min: 100

    - id: omni
      label: OMNI Energy
      kind: vendor
      enabled: true
      url: https://myomnienergy.com/heating-fuel/
      site_url: https://myomnienergy.com/
      extract:
        # Note the curly apostrophe — this is the site's own text.
        - anchor: "Today’s Price is"
          window: 2
          product: fuel_oil
          default_gallon_min: 100

    - id: armstrong
      label: Armstrong Oil & Propane
      kind: vendor
      enabled: true
      url: https://armstrongoilandpropane.com/
      # Heating oil is published as "$-.--- Please Call", so only propane has an
      # actual number. Captured as propane rather than pretending it is oil.
      extract:
        - anchor: "Today's Propane Pricing"
          window: 28
          product: propane

    # ------------------------------------------------------- cannot be scraped
    # Kept in the roster with a reason rather than deleted, so the list stays a
    # complete record of what was investigated. The "blocked" kind throws if one
    # is ever enabled, so none can be switched on by accident.
    - id: firstfuel
      label: First Fuel Oil
      kind: blocked
      enabled: false
      url: https://www.firstfueloil.com/
      # The page parses fine and the extract rule below is known good — it was
      # verified against the live site — but the host returns 403 to Railway
      # while returning 200 to a residential connection with the identical user
      # agent. That is their WAF refusing this server, not a parsing problem.
      #
      # Getting past it would mean disguising where the request comes from, so
      # it stays off. The route back in is asking First Fuel to allow the
      # monitor, not evading the block. If they do, restore kind: vendor and the
      # rule below.
      #   extract:
      #     - anchor: "Today's Oil Pricing"
      #       window: 14
      #       product: fuel_oil
      disabled_reason: >-
        Host returns HTTP 403 to this server while serving 200 to a residential
        IP with the same user agent — a WAF block on the datacenter range.
        Parsing is known good; only the request is refused.

    - id: forbes
      label: Forbes Fuel Oil
      kind: blocked
      enabled: false
      url: https://forbesfueloil.com/
      disabled_reason: >-
        Serves a BotStopper proof-of-work challenge on every path, including
        /wp-json/ and the sitemap. Reading it means defeating an access control
        the owner installed, not parsing a public page.

    - id: hurricane
      label: Hurricane Energy
      kind: blocked
      enabled: false
      url: https://hurricaneenergyct.com/get-price
      disabled_reason: >-
        No price in the served HTML. The page embeds a third-party
        api.dropletfuel.com widget, so the price belongs to that service rather
        than to this site.

    - id: tonys
      label: Tony's Oil
      kind: blocked
      enabled: false
      url: https://www.tonysoil.com/order/
      disabled_reason: >-
        Price is rendered client-side; the served HTML shows only "Loading...".
        Reading it would need a headless browser.

    - id: delivermefuel
      label: Deliver Me Fuel (Hitchcock)
      kind: blocked
      enabled: false
      url: https://www.delivermefuel.com/
      disabled_reason: >-
        Prices are behind a customer account — the site offers a quote only
        after registration and login.

    - id: federal
      label: Federal Oil
      kind: blocked
      enabled: false
      url: https://www.bbb.org/us/ct/ansonia/profile/fuel-oil/federal-oil-llc-0111-87088359
      disabled_reason: >-
        No company website found; the business appears only in directories and
        price aggregators, which are not the vendor's own published price.

    - id: it-energy
      label: IT Energy
      kind: blocked
      enabled: false
      url: https://example.invalid/
      disabled_reason: >-
        No Connecticut heating oil company by this name could be identified.
        Needs a website or exact business name to proceed.

  limits:
    timeout_ms: 25000
    # Applied across the whole run, not per source. A full scrape is ~15
    # requests, so all these sites together see ~1440 hits a day between them.
    request_delay_ms: 4000
    max_retries: 2

  alerts:
    digest_hour: 7
    timezone: America/New_York
    source_failure_alert_after: 3
    # Hours of history in the CSV attached to each alert.
    csv_window_hours: 24

alerts:
  discord_on_consecutive_failures: 3
  channel: oil

dashboard:
  window_hours: 24
