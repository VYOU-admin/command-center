# New-token watch — known wallets buying tokens that just launched.
#
# MEASURED BEFORE BUILDING (2026-09-01), on chain 4663:
#   17,642 pools created per 24h (mean 735/hour, range 396-1,102)
#   183,201 swaps/hour across 3,042 pools; 117,101 in pools under 24h old
#   -> pool-first attribution needs ~117k receipts/hour = ~3.6h of fetching.
#      It cannot keep up with an hourly cycle, so this is wallet-first.
#   7,700 inbound transfers/hour to the watchlist, of which 1,980 come from
#      the PoolManager (an actual swap rather than an airdrop)
#   under the 2h pool-age rule: 1,119 transfers, 53 tokens, 217 wallets,
#      556 distinct (token, wallet) pairs per hour
#
# Sends one message per cycle to the newtoken channel. A cycle with no hits
# sends nothing rather than an empty message.
# KNOWN GAP: v3 launches are invisible; this keys off the v4 PoolManager.

id: new-token-watch
name: New Token Watch
source: new-token-watch
enabled: true
# Four cycles an hour, one stagger group each, so every wallet is still covered
# hourly while each cycle issues a quarter of the requests.
schedule: 15m

alerts:
  # Content alerts go to the new-token channel (DISCORD_WEBHOOK_NEWTOKEN).
  # Failure and recovery alerts still go to system, which the spine routes
  # independently of this setting.
  channel: newtoken

options:
  chain: robinhood
  # No ALCHEMY_API_KEY in the deployed service, and none is needed: every call
  # here is served by the free public endpoint.
  rpc_url: https://rpc.mainnet.chain.robinhood.com
  pool_manager: "0x8366a39cc670b4001a1121b8f6a443a643e40951"

  # Topic hashes are COPIED FROM WORKING CODE, never recalled. Initialize was
  # identified empirically: it is the only 4-topic PoolManager event carrying
  # QUANT's poolId at its known creation block, with 160 data bytes and both
  # currency topics address-shaped.
  initialize_topic: "0xdd466e674ea557f56295e2d0218a125ea4b4f0f6f3307b95f85e6110838d6438"
  transfer_topic: "0xddf252ad1be2c89b69c2b068fc378daa952ba7f163c4a11628f55a4df523b3ef"

  # Set false to run a populating cycle without sending, e.g. while dry-running
  # a message-format change.
  # MUTED 2026-09-02 on request. Set back to true to resume Discord sends.
  send_alerts: false

  max_pool_age_minutes: 120
  lookback_hours: 1
  # Only needs to exceed max_pool_age_minutes, NOT 24h. Anything created before
  # the swept range is necessarily older than the age rule and is dropped, so a
  # 24h bootstrap bought nothing and cost 4m47s of the spine's hard 5-minute run
  # ceiling, aborting the first live cycle.
  bootstrap_hours: 3
  retention_hours: 24

  # Measured ceilings on this chain: >1,000 topic selectors is rejected, 500
  # addresses over 2,000 blocks times out, 200 over 10,000 blocks is reliable.
  # 2,480 addresses / 250 = 10 chunks x 2 windows = 20 requests, down from 52.
  # The container's per-request latency to the public RPC is far higher than a
  # local run's, and 52 requests did not fit the spine's 5-minute ceiling.
  # A window that times out is split automatically, so a too-large window
  # degrades into two smaller queries rather than failing the run.
  # 6,344 watchlist wallets / 200 = 32 chunks. At a 20,000-block window that is
  # 2 windows per chunk instead of 4, so 64 transfer requests rather than 128.
  # 20,000 is well inside what this endpoint serves for bulk logs (the swap
  # puller has used 25,000 throughout), and the sweep has used 20,000 since day
  # one. A window that still comes back too large is split by PublicRpc.logs.
  # One group's transfers per cycle. Group is derived from the wallet address,
  # so it never changes as the watchlist grows.
  watchlist_groups: 4

  watchlist_chunk: 200
  transfer_block_window: 20000
  sweep_block_window: 20000
  # 4,000 ms is the MEASURED point where 429s stop on this endpoint: at 800 ms
  # 15 of 20 requests were refused, at 2,500 ms 6 of 20, at 4,000 ms none. Every
  # duration projection assumes this pacing.
  min_interval_ms: 4000
