# Solana token balance readings, plus price and market cap.
#
# MIRRORS token-balance-scan's CONTRACT, not its mechanics: append-only, a
# failed read is never stored as zero, an unattempted wallet gets no row. What
# differs is forced by the chain.
#
# ONE getProgramAccounts CALL, NOT DERIVED ATAs, and it is the more correct read
# as well as the cheaper one. Measured on this mint:
#   - MOS is TOKEN-2022. Filtering the legacy SPL Token program returns 0
#     accounts, so ATA math aimed at the legacy program id would have produced
#     addresses that do not exist and reported every wallet as no_account.
#   - Token-2022 accounts carry extensions and are not all 165 bytes. A
#     dataSize:165 filter returns 21 accounts; dropping it returns 6,154 -- a
#     size filter would have hidden 99.7% of holders.
#   - 6,154 accounts came back in ONE call in 0.2 s. Deriving 854 ATAs would
#     have been 9 getMultipleAccounts calls and still wrong on both counts above.
#
# NO CURSOR: one call covers all 854 wallets, so there is nothing to resume.
#
# PRICE HAS NO ROBINHOOD EQUIVALENT TO MIRROR. Nothing on the EVM side refreshes
# wallet_pnl_tokens.price_usd -- it is a snapshot written once by the pipeline
# loader, which is why PONS still shows a price from its run. This is a genuine
# hourly reading, recorded as a deliberate difference rather than a match.

id: solana-balance-scan
name: Solana Balance Scan
source: solana-balance-scan
enabled: true

schedule: 1h

alerts:
  # Same channel as the two new-token alerts. Those announce BUYS of newly
  # launched tokens; this announces BALANCE MOVES of a known cohort, so the
  # message header names both to keep them apart at a glance.
  channel: newtoken

options:
  token: MOS
  mint: "4ChT49V1iazP2XUGtycGkEsS6pRMqvGfUbqvRC9Z91ZT"
  # Token-2022, NOT TokenkegQfeZyiNwAJbNbGKPFXCWuBvf9Ss623VQ5DA. Verified by
  # reading the mint account's owning program, not assumed from the ticker.
  token_program: "TokenzQdBNbLqP5VEhdkAS6EPFLC1PHnBqCXEpPxuEb"
  rpc_url: "https://mainnet.helius-rpc.com/?api-key=${HELIUS_API_KEY}"
  # The DYN2 MOS/USDC pool: 99.7% of all MOS liquidity.
  dexscreener_pair: "gjL62zuUAdJm7cZhrWtnBoCGN31kSFyWHScEYfTWiWh"

  # Set false to run a scan without sending. Balances and price still land.
  send_alerts: true
